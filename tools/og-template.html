<!doctype html>
<html><head><meta charset="utf-8"><style>
  * { box-sizing: border-box; margin: 0; }
  body {
    width: 1200px; height: 630px; overflow: hidden;
    font-family: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: #0b1220; color: #fff; position: relative;
  }
  .glow {
    position: absolute; inset: -30% -10% auto -10%; height: 700px;
    background:
      radial-gradient(45% 55% at 20% 45%, rgba(37,99,235,.62), transparent 70%),
      radial-gradient(40% 55% at 80% 25%, rgba(14,165,233,.38), transparent 72%);
  }
  .inner { position: relative; padding: 64px 80px; height: 100%; display: flex; flex-direction: column; justify-content: center; }
  .brand { display: flex; align-items: center; gap: 16px; }
  .brand span { font-size: 27px; font-weight: 700; letter-spacing: -.01em; }
  h1 {
    margin-top: 48px; font-size: 62px; line-height: 1.08; letter-spacing: -.035em;
    font-weight: 700; max-width: 17ch;
  }
  p { margin-top: 24px; font-size: 25px; color: rgba(233,238,246,.72); max-width: 46ch; }
  .rule { margin-top: 38px; padding-top: 26px; border-top: 1px solid rgba(255,255,255,.16);
          display: flex; gap: 44px; font-size: 20px; color: rgba(233,238,246,.6); }
  .rule b { color: #38bdf8; font-weight: 650; }
</style></head>
<body>
  <div class="glow"></div>
  <div class="inner">
    <div class="brand">
      <svg width="46" height="46" viewBox="0 0 32 32">
        <rect width="32" height="32" rx="8" fill="#2563eb"/>
        <path d="M8 22V10l8 7 8-7v12" fill="none" stroke="#fff" stroke-width="2.6" stroke-linejoin="round" stroke-linecap="round"/>
      </svg>
      <span>MSP Growth Partners</span>
    </div>
    <h1>We help MSPs build the path from $2M to $10M</h1>
    <p>Positioning, websites, SEO and outbound — built only for managed service providers.</p>
    <div class="rule">
      <div><b>GTM Foundation</b> &nbsp;Month one</div>
      <div><b>Growth Engine</b> &nbsp;Ongoing execution</div>
    </div>
  </div>
</body></html>
